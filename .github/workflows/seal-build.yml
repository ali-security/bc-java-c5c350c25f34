name: seal-build

# Pack-only: builds bcpkix-jdk18on with the project's Gradle 8.5 wrapper and uploads the jar.
# The test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8, 11, 21 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8.0.402
            11.0.22
            21.0.2
            17.0.10

      - name: Build bcpkix jar
        run: |
          export BC_JDK8="$JAVA_HOME_8_X64" BC_JDK11="$JAVA_HOME_11_X64" BC_JDK17="$JAVA_HOME_17_X64" BC_JDK21="$JAVA_HOME_21_X64"
          export JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF8
          java -version
          ./gradlew --no-daemon --console=plain -s --init-script ci/seal-init.gradle :pkix:jar
          ls -l pkix/build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: bcpkix-jdk18on-jar
          path: pkix/build/libs/bcpkix-jdk18on-1.78.jar
          if-no-files-found: error
